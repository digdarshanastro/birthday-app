<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Special Wishes — Digdarshan Astro</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="new style.css"> 

    <meta property="og:title" content="Special Wishes from Digdarshan Astro!" />
    <meta property="og:description" content="Wishing you immense joy and success from Jyotish Devagya Amitsree." />
    <meta property="og:image" content="https://digdarshanastro.mydurable.com/Digdarshan%20Astro%20Logo.png" /> 
    <meta property="og:url" content="https://your-app-domain.vercel.app/card.html" /> 
    <meta property="og:type" content="website" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script> 
</head>

<body class="card-page">

    <div id="card">
        <div class="card-border">
            <div id="coloredFrame" class="colored-frame">
                
                <div class="card-top-section" id="cardImageSection" onclick="downloadCard()">
                    <img id="cardImage" src="" alt="Greeting Image" class="card-top-image">
                    
                    <div id="downloadIcon">
                        <img src="download_icon.png" alt="Download PNG Icon">
                    </div>
                </div>

                <div class="card-content-section">
                    <div>
                        <h2 id="headerText" class="header-text"></h2>
                        <p id="mainMessage" class="main-message"></p>
                    </div>
                    <div class="footer-signature">
                        With Best Wishes from
                        <strong class="company-name">Digdarshan Astro</strong>
                        <span class="address-text">47F Raja Rammohan Roy Road, Kolkata-8.</span> 
                        Jyotish Devagya Amitsree
                        <span id="callNumber" class="call-number">Call : 8697190840 / 9830637766</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const type = params.get('type') || 'birthday'; 
        // cardType: Bday -> floral, simple | Anniv -> cake, heart
        const cardType = params.get('cardType') || (type === 'birthday' ? 'simple' : 'cake'); 
        const name = params.get('name') || 'Dear Client';
        const age = params.get('age'); 

        const cardImage = document.getElementById('cardImage');
        const headerText = document.getElementById('headerText');
        const mainMessage = document.getElementById('mainMessage');
        const coloredFrame = document.getElementById('coloredFrame');
        const callNumber = document.getElementById('callNumber');
        const cardContainer = document.getElementById('card'); // Element to capture

        let imageUrl = '';
        let headerMsg = '';
        let message = '';
        let frameColor = '';
        let headerTextColor = ''; 
        let callNumberColor = '';

        // --- THEMES (Adjusted to match previous BD/AC types) ---
        const themes = {
            birthday: {
                // Image (birthday77.png - Simple/Candles)
                simple: {
                    imageUrl: 'birthday77.png', 
                    frameColor: '#A0522D', // Sienna/Brown
                    headerTextColor: '#B8860B', // DarkGoldenrod
                    callNumberColor: '#B8860B'
                },
                // Image (birthday66.jpg - Floral/Purple)
                floral: { 
                    imageUrl: 'birthday66.jpg', 
                    frameColor: '#53005A', // Deep Purple
                    headerTextColor: '#993399', // Medium Purple
                    callNumberColor: '#993399'
                }
            },
            anniversary: {
                // Image (anniversary88.jpg - Cake)
                cake: {
                    imageUrl: 'anniversary88.jpg', 
                    frameColor: '#8B0000', // Deep Red
                    headerTextColor: '#DAA520', // Goldenrod
                    callNumberColor: '#8B0000'
                },
                // Image (anniversary99.jpg - Heart)
                heart: { 
                    imageUrl: 'anniversary99.jpg', 
                    frameColor: '#CC0000', // Bright Red
                    headerTextColor: '#B8860B', // DarkGoldenrod
                    callNumberColor: '#CC0000'
                }
            }
        };

        const currentTheme = themes[type]?.[cardType] || themes.birthday.simple;

        imageUrl = currentTheme.imageUrl;
        frameColor = currentTheme.frameColor;
        headerTextColor = currentTheme.headerTextColor;
        callNumberColor = currentTheme.callNumberColor;

        // --- MESSAGE LOGIC ---
        if (type === 'birthday') {
            headerMsg = `Happy ${age ? age + 'th ' : ''} Birthday, ${name}! 🎉`;
            message = `May the stars bring you immense joy and success this year. Start your new personal year with cosmic guidance from Jyotish Devagya Amitsree. Get a special birthday discount on a birth chart reading & Gemstone!`;

        } else if (type === 'anniversary') {
            headerMsg = `Happy ${age ? age + 'th ' : ''} Anniversary, ${name}! 🥂`;
            message = `May the stars bring you immense joy and success this year. Start your new personal year with cosmic guidance from Jyotish Devagya Amitsree. Get a special anniversary discount on a birth chart reading & Gemstone!`;
        }

        // --- RENDERING ---
        cardImage.src = imageUrl;
        cardImage.alt = `${type} card image`;
        
        headerText.innerHTML = headerMsg;
        mainMessage.textContent = message;
        coloredFrame.style.borderColor = frameColor;
        headerText.style.color = headerTextColor; 
        callNumber.style.color = callNumberColor;
        
        // --- DOWNLOAD FUNCTION (NEW) ---
        window.downloadCard = function() {
            // Temporarily hide elements that shouldn't be in the final image (like the download icon itself)
            const downloadIcon = document.getElementById('downloadIcon');
            downloadIcon.style.opacity = '0';
            downloadIcon.style.pointerEvents = 'none';

            html2canvas(cardContainer, {
                allowTaint: true,
                useCORS: true,
                scale: 2, // Capture at a higher resolution for better quality
                backgroundColor: null // Ensure background is transparent if needed, or controlled by CSS
            }).then(canvas => {
                // Create a link element to trigger the download
                const link = document.createElement('a');
                // Use the card type and name for the filename
                const fileName = `${type.toUpperCase()}_Card_${name.replace(/\s/g, '_')}_${cardType}.png`;
                link.download = fileName;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).finally(() => {
                // Restore the download icon state after capture
                downloadIcon.style.opacity = '';
                downloadIcon.style.pointerEvents = '';
            });
        };
        
        // Expose function globally for admin.html to use (unchanged)
        function getWhatsAppMessage(cardLink) {
             const baseText = `*DIGDARSHAN ASTRO* wants to wish you a very happy ${type === 'birthday' ? 'Birthday' : 'Anniversary'}! \n\n*Special Offer just for you* - Get cosmic guidance from Jyotish Devagya Amitsree. \n\n_Visit our site for exciting offers_: https://digdarshanastro.mydurable.com/`;
             return `${baseText}\n\n${cardLink}`;
        }
        window.getWhatsAppMessage = getWhatsAppMessage;
        
    </script>
</body>
</html>
