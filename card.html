<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Special Wishes — Digdarshan Astro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="new style.css">

    <meta property="og:title" content="Special Wishes from Digdarshan Astro!" />
    <meta property="og:description" content="Wishing you immense joy and success from Jyotish Devagya Amitsree." />
    <meta property="og:image" content="https://digdarshanastro.mydurable.com/Digdarshan%20Astro%20Logo.png" /> 
    <meta property="og:url" content="https://your-app-domain.vercel.app/card.html" /> 
    <meta property="og:type" content="website" />
</head>

<body class="card-page">

    <div id="card">
        <div class="card-border">
            <div id="coloredFrame" class="colored-frame">
                <div class="card-content">
                    <div class="left-section">
                        <img id="cardImage" src="" alt="Greeting Image">
                    </div>
                    <div class="right-section">
                        <div>
                            <h2 id="headerText" class="header-text"></h2>
                            <p id="mainMessage" class="main-message"></p>
                        </div>
                        <div class="footer-signature">
                            With Best Wishes from
                            <strong class="company-name">Digdarshan Astro</strong>
                            <span class="address-text">47F Raja Rammohan Roy Road, Kolkata-8.</span> 
                            Jyotish Devagya Amitsree
                            <span class="call-number">Call : 8697190840 / 9830637766</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const type = params.get('type') || 'birthday';
        const cardType = params.get('cardType') || 'floral';
        const name = params.get('name') || 'Dear Client';
        const age = params.get('age'); 

        const cardImage = document.getElementById('cardImage');
        const headerText = document.getElementById('headerText');
        const mainMessage = document.getElementById('mainMessage');
        const coloredFrame = document.getElementById('coloredFrame');

        let imageSrc = '';
        let headerMsg = '';
        let message = '';
        let frameColor = '';
        let headerBorderColor = '';

        if (type === 'birthday') {
            switch (cardType) {
                case 'floral':
                    imageSrc = 'birthday66.png';
                    frameColor = '#A3333D'; 
                    headerBorderColor = '#A3333D';
                    break;
                case 'simple':
                    imageSrc = 'birthday77.png';
                    frameColor = '#4A69A3'; 
                    headerBorderColor = '#4A69A3';
                    break;
                default:
                    imageSrc = 'birthday66.png';
                    frameColor = '#A3333D';
                    headerBorderColor = '#A3333D';
            }
            headerMsg = `Happy ${age ? age + 'th ' : ''} Birthday, ${name}! 🎉`;
            message = `May the stars bring you immense joy and success this year. Start your new personal year with cosmic guidance from Jyotish Devagya Amitsree. Get a special birthday discount on a birth chart reading & Gemstone!`;

        } else if (type === 'anniversary') {
            switch (cardType) {
                case 'cake':
                    imageSrc = 'anniversary88.png';
                    frameColor = '#7A2D00'; 
                    headerBorderColor = '#7A2D00';
                    break;
                case 'heart':
                    imageSrc = 'anniversary99.png';
                    frameColor = '#A3333D'; 
                    headerBorderColor = '#A3333D';
                    break;
                default:
                    imageSrc = 'anniversary99.png';
                    frameColor = '#A3333D';
                    headerBorderColor = '#A3333D';
            }
            headerMsg = `Happy ${age ? age + 'th ' : ''} Anniversary, ${name}! 🥂`;
            message = `May the stars bring you immense joy and success this year. Start your new personal year with cosmic guidance from Jyotish Devagya Amitsree. Get a special anniversary discount on a birth chart reading & Gemstone!`;
        }

        cardImage.src = imageSrc;
        headerText.innerHTML = headerMsg;
        mainMessage.textContent = message;
        coloredFrame.style.borderColor = frameColor;
        headerText.style.borderColor = headerBorderColor;
        // Also set header text color for better contrast
        headerText.style.color = frameColor; 

        // Function to generate the WhatsApp text with the new message
        function getWhatsAppMessage(cardLink) {
             const baseText = `*DIGDARSHAN ASTRO*\nIn Partnership with Parashmoni (Gems & Jewellery).\nVisit our site for *exciting offers*: https://digdarshanastro.mydurable.com/`;
             
             // The WhatsApp button in admin.html already passes the card URL, 
             // so the final message will be: BaseText + Line Break + CardLink
             return `${baseText}\n\n${cardLink}`;
        }
        
        // Expose function globally for admin.html to use
        window.getWhatsAppMessage = getWhatsAppMessage;
        
    </script>
</body>
</html>
