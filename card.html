<!DOCTYPE html>
<html>
<head>
<title>Astro Wish Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* RESET */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',sans-serif;
  background:#f5f1ff;
  display:flex;
  justify-content:center;
  padding:20px 0;
}

/* THEME VARIABLES */
:root{
  --primary:#9b28b8;
  --secondary:#ff5890;
  --offer-bg:#fde7ff;
}

/* GOLD CORNER FOLD BORDER */
.border-frame{
  position:relative;
  padding:28px;
  width:95%;
  max-width:430px;
  background:#fff;
  border-radius:26px;
  border:4px solid #d8a842;
  box-shadow:0 0 18px rgba(0,0,0,0.18);
}

/* Corner folds */
.border-frame::before,
.border-frame::after,
.corner-bl,
.corner-br{
  content:"";
  position:absolute;
  width:32px;
  height:32px;
  background:linear-gradient(135deg,#f5d68a,#c79328);
  z-index:5;
}

/* top-left */
.border-frame::before{
  top:-3px; left:-3px;
  border-radius:0 0 12px 0;
  clip-path:polygon(0 0,100% 0,0 100%);
}

/* top-right */
.border-frame::after{
  top:-3px; right:-3px;
  border-radius:0 0 0 12px;
  clip-path:polygon(0 0,100% 0,100% 100%);
}

/* bottom-left */
.corner-bl{
  bottom:-3px; left:-3px;
  border-radius:0 12px 0 0;
  clip-path:polygon(0 0,100% 100%,0 100%);
}

/* bottom-right */
.corner-br{
  bottom:-3px; right:-3px;
  border-radius:12px 0 0 0;
  clip-path:polygon(100% 0,100% 100%,0 100%);
}

/* IMAGE */
.top-section img{
  width:100%;
  max-height:360px;
  object-fit:contain;
  display:block;
  margin:0 auto 10px;
}

/* TEXTS */
.header-text{
  font-family:'Playfair Display',serif;
  font-size:34px;
  font-weight:900;
  margin-top:12px;
  color:var(--primary);
}

.name-text{
  margin:8px 0;
  font-size:24px;
  font-weight:900;
  color:var(--secondary);
}

.greeting{
  margin-top:8px;
  padding:0 14px;
  font-size:16px;
  color:#444;
  line-height:1.55;
  text-align:center;
}

/* OFFER BOX */
.offer-box{
  background:var(--offer-bg);
  border:2px solid var(--primary);
  margin:22px 14px;
  padding:16px 12px;
  border-radius:18px;
  text-align:center;
}

.offer-box strong{
  color:var(--primary);
  font-size:18px;
}

/* FOOTER */
.footer{text-align:center;margin-top:25px}
.footer .line{margin-bottom:6px;color:#444}
.footer .brand{
  font-size:22px;
  font-family:'Playfair Display',serif;
  font-weight:900;
  color:var(--primary);
}
.footer .contact{
  margin-top:8px;
  font-size:18px;
  font-weight:900;
  color:var(--primary);
}

/* DOWNLOAD BUTTON */
#downloadButton{
  position:absolute;
  top:-22px; right:-22px;
  width:50px;
  height:50px;
  background:var(--primary);
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,0.25);
  z-index:50;
}

#downloadButton:hover{
  transform:scale(1.08);
}

@media(max-width:480px){
  .header-text{font-size:28px}
  .name-text{font-size:20px}
}
</style>
</head>

<body>

<div id="card" class="border-frame">

  <div id="downloadButton">⬇</div>
  <div class="corner-bl"></div>
  <div class="corner-br"></div>

  <div class="card-inner">

    <div class="top-section">
      <img id="cardImage" src="">
    </div>

    <h2 id="headerText" class="header-text"></h2>
    <h3 id="nameText" class="name-text"></h3>
    <p id="greetingText" class="greeting"></p>

    <div class="offer-box">
      <strong id="offerHeader"></strong><br>
      <span id="offerDetails"></span>
    </div>

    <div class="footer">
      <span class="line">With Best Wishes from</span>
      <div class="brand">Digdarshan Astro</div>
      <div class="line">47F Raja Rammohan Roy Road, Kolkata-8.<br>Jyotish Devagya Amitsree</div>
      <div class="contact">Call : 8697190840 / 9830637766</div>
    </div>

  </div>
</div>

<script>
const url = new URLSearchParams(window.location.search);
const type = url.get("type") || "birthday";
const cardType = url.get("cardType") || "floral";
let name = decodeURIComponent(url.get("name") || "Dear Client");

const IMG = {
  birthday:{
    floral:"birthday66.png",
    simple:"birthday77.png"
  },
  anniversary:{
    cake:"anniversary88.png",
    heart:"anniversary99.png"
  }
};

let img = IMG[type]?.[cardType] || IMG.birthday.floral;

document.getElementById("cardImage").src = img;

if(type==="birthday"){
  document.getElementById("headerText").innerHTML="HAPPY BIRTHDAY";
  document.getElementById("greetingText").innerHTML=
    "May the stars bring you immense joy and success on your special day. Get cosmic guidance from Jyotish Devagya Amitsree.";
  document.getElementById("offerHeader").innerHTML="Get a Special Discount on Your Birthday";
  document.getElementById("offerDetails").innerHTML="Chart Reading / Gemstones / Rudraksha / Hoom / Hawan etc.";
}
else{
  document.getElementById("headerText").innerHTML="HAPPY ANNIVERSARY";
  document.getElementById("greetingText").innerHTML=
    "Wishing you endless happiness and continued success in your journey together. Get cosmic blessings from Jyotish Devagya Amitsree.";
  document.getElementById("offerHeader").innerHTML="Get a Special Discount on Your Anniversary";
  document.getElementById("offerDetails").innerHTML="Marriage Consultation / Family Problem Solutions / Vastu Tips etc.";
}

document.getElementById("nameText").innerHTML=name;

/* DOWNLOAD PNG */
document.getElementById("downloadButton").onclick = ()=>{
  const btn = document.getElementById("downloadButton");
  btn.style.display="none";

  html2canvas(document.getElementById("card"),{scale:2}).then(canvas=>{
    const link=document.createElement("a");
    link.download=`DigdarshanAstro_${name.replace(/\s/g,'_')}.png`;
    link.href=canvas.toDataURL();
    link.click();
    btn.style.display="flex";
  });
};
</script>

</body>
</html>
