<!DOCTYPE html>
<html>
<head>
<title>Wish Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style (3).css"> 
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script> 

<meta property="og:title" content="Special Wishes from Digdarshan Astro!" />
<meta property="og:description" content="Wishing you immense joy and success from Jyotish Devagya Amitsree." />
<meta property="og:image" content="https://digdarshanastro.mydurable.com/Digdarshan%20Astro%20Logo.png" /> 
<meta property="og:url" content="https://your-app-domain.vercel.app/card.html" /> 
<meta property="og:type" content="website" />
</head>

<body class="card-page"> 

<div id="card">
  <div class="card-border"> 
      <div id="coloredFrame" class="colored-frame"> 
          <div class="card-content">
              <div class="left-section" id="cardImageSection" onclick="downloadCard()">
                  <img id="cardImage" src="" alt="Greeting Image">
                  <div id="downloadIcon">
                      <img src="download_icon.png" alt="Download PNG Icon">
                  </div>
              </div>
              
              <div class="right-section">
                  <div>
                      <h2 id="headerText" class="header-text"></h2>
                      <p id="mainMessage" class="main-message"></p>
                  </div>
                  
                  <a id="whatsappButton" href="#" target="_blank" onclick="event.preventDefault(); shareToWhatsApp()">
                    Share on WhatsApp
                  </a>

                  <div class="footer-signature">
                    With Best Wishes from
                    <strong class="company-name">Digdarshan Astro</strong>
                    <span class="address-text">47F Raja Rammohan Roy Road, Kolkata-8.</span> 
                    Jyotish Devagya Amitsree
                    <span class="call-number" id="callNumber">Call : 8697190840 / 9830637766</span>
                  </div>
              </div>
          </div>
      </div>
  </div>
</div>

<script>
const url = new URLSearchParams(window.location.search);
const type = url.get("type") || 'birthday'; 
const cardType = url.get("cardType") || (type === 'birthday' ? 'elegant' : 'cake'); // Default to elegant/cake
let name = url.get("name");
let age = url.get("age");
let annivAge = url.get("annivAge"); 

name = name ? decodeURIComponent(name) : "Dear Client";
age = age ? Number(age) : (annivAge ? Number(annivAge) : null);

const coloredFrameElement = document.getElementById("coloredFrame"); 
const cardImage = document.getElementById("cardImage");
const headerTxtElement = document.getElementById("headerText");
const msgTxtElement = document.getElementById("mainMessage");
const callNumberElement = document.getElementById("callNumber");
const cardContainer = document.getElementById('card'); 
const whatsappButton = document.getElementById('whatsappButton');

let headerText = '';
let discountText = '';
let imageURL = '';
let frameColor = '';
let headerColor = '';
let callNumberColor = '';

// **THEME DEFINITIONS** - 2 Birthday, 2 Anniversary
const themes = {
    birthday: {
        // Theme 1: Elegant (using birthday66.jpg)
        elegant: {
            img: 'birthday66.jpg', 
            discount: "a special *birthday discount* on a birth chart reading & Gemstone!",
            borderColor: '#5D4037', // Brown/Coffee
            headerColor: '#5D4037', 
            callColor: '#5D4037'
        },
        // Theme 2: Vibrant (using birthday77.png)
        vibrant: {
            img: 'birthday77.png',
            discount: "a special *birthday discount* on a birth chart reading & Gemstone!",
            borderColor: '#9C27B0', // Deep Purple
            headerColor: '#9C27B0', 
            callColor: '#9C27B0'
        }
    },
    anniversary: {
        // Theme 3: Classic (using anniversary88.jpg)
        cake: {
            img: 'anniversary88.jpg',
            discount: "a special *anniversary discount* on a birth chart reading & Gemstone!",
            borderColor: '#D32F2F', // Deep Red
            headerColor: '#D32F2F',
            callColor: '#D32F2F'
        },
        // Theme 4: Romantic (using anniversary99.jpg)
        heart: { 
            img: 'anniversary99.jpg',
            discount: "a special *anniversary discount* on a birth chart reading & Gemstone!",
            borderColor: '#FFC107', // Amber/Gold
            headerColor: '#FFC107', 
            callColor: '#FFC107'
        }
    }
};

let currentTheme = null;

if (type === 'birthday') {
    currentTheme = themes.birthday[cardType] || themes.birthday.elegant;
    headerText = `Happy ${age ? age + 'th ' : ''} Birthday, ${name}! 🎉`;
} else if (type === 'anniversary') {
    currentTheme = themes.anniversary[cardType] || themes.anniversary.cake;
    headerText = `Happy ${age ? age + 'th ' : ''} Anniversary, ${name}! 🥂`;
} else {
    headerText = `Hello, ${name}!`;
    discountText = "a special gift!";
    currentTheme = themes.birthday.elegant; 
}

// Apply theme settings
if (currentTheme) {
    imageURL = currentTheme.img;
    discountText = currentTheme.discount;
    frameColor = currentTheme.borderColor;
    headerColor = currentTheme.headerColor;
    callNumberColor = currentTheme.callColor;

    coloredFrameElement.style.borderColor = frameColor;
    headerTxtElement.style.color = headerColor;
    headerTxtElement.style.borderColor = headerColor;
    callNumberElement.style.color = callNumberColor;
}


const mainMessage = `May the stars bring you immense joy and success this year. Start your new personal year with cosmic guidance from Jyotish Devagya Amitsree. Get ${discountText}`;

cardImage.src = imageURL;
headerTxtElement.innerHTML = headerText;
msgTxtElement.innerHTML = mainMessage;

// --- DOWNLOAD FUNCTION ---
window.downloadCard = function() {
    // Hide share button before capturing
    whatsappButton.style.display = 'none';
    const downloadIcon = document.getElementById('downloadIcon');
    downloadIcon.style.opacity = '0';
    downloadIcon.style.pointerEvents = 'none';

    html2canvas(cardContainer, {
        allowTaint: true,
        useCORS: true,
        scale: 2, 
        backgroundColor: null 
    }).then(canvas => {
        const link = document.createElement('a');
        const fileName = `${type.toUpperCase()}_Card_${name.replace(/\s/g, '_')}_${cardType}.png`;
        link.download = fileName;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }).finally(() => {
        // Restore elements
        whatsappButton.style.display = 'block';
        downloadIcon.style.opacity = '';
        downloadIcon.style.pointerEvents = '';
    });
};

// --- WHATSAPP SHARE FUNCTION ---
function shareToWhatsApp() {
    // Generate the message with the current card URL
    const cardLink = window.location.href;
    const shareMessage = getWhatsAppMessage(cardLink);
    
    const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(shareMessage)}`;
    window.open(whatsappUrl, '_blank');
}
window.shareToWhatsApp = shareToWhatsApp;

// --- WHATSAPP MESSAGE GENERATOR (for Admin Panel) ---
window.getWhatsAppMessage = function(cardLink) {
     // Text starts with Digdarshan Astro, followed by company details.
     const baseText = `*DIGDARSHAN ASTRO* wants to wish you a very happy ${type === 'birthday' ? 'Birthday' : 'Anniversary'}! \n\n*Special Offer just for you* - Get cosmic guidance from Jyotish Devagya Amitsree.\n\n_Visit our site for exciting offers_:\nhttps://digdarshanastro.mydurable.com/`;
     
     return `${baseText}\n\n${cardLink}`;
};

</script>
</body>
</html>
