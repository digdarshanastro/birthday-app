<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digdarshan Astro Card</title>

<link rel="stylesheet" href="card-style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>
<body>

<div id="cardContainer">
    <div id="downloadButton">⬇</div>

    <!-- Outer Border -->
    <div class="border-frame">

        <!-- Inner card -->
        <div class="card-inner">

            <div class="top-section">
                <img id="cardImage" src="" alt="">
            </div>

            <h2 id="headerText" class="header-text"></h2>
            <p id="greetingText" class="greeting"></p>

            <div class="offer-box">
                <strong id="offerHeader"></strong>
                <p id="offerDetails"></p>
            </div>

            <div class="footer">
                With Best Wishes from<br>
                <b>Digdarshan Astro</b><br>
                47F Raja Rammohan Roy Road, Kolkata-8.<br>
                Jyotish Devagya Amitsree<br>
                <span class="call-line">Call : 8697190840 / 9830637766</span>
            </div>

        </div>
    </div>
</div>

<script>
const qs = new URLSearchParams(window.location.search);
const type = qs.get("type") || "birthday";
const cardType = qs.get("cardType") || "floral";
const name = decodeURIComponent(qs.get("name") || "Dear Client");

// THEMES
const themes = {
    birthday:{
        floral:{
            img:"birthday66.png",
            color1:"#7B1FA2",
            color2:"#D81B60",
            offer:"Get a Special Discount on Your Birthday",
            details:"Chart Reading / Gemstones / Rudraksha / Hoom / Hawan etc."
        },
        simple:{
            img:"birthday77.png",
            color1:"#6A1B9A",
            color2:"#AD1457",
            offer:"Special Birthday Offer",
            details:"Gemstones / Rudraksha / Horoscope Guidance / Hoom-Hawan etc."
        }
    },
    anniversary:{
        heart:{
            img:"anniversary99.png",
            color1:"#C00000",
            color2:"#FF5C8D",
            offer:"Get a Special Discount on Your Anniversary",
            details:"Marriage Consultation / Family Problem Solutions / Vastu Tips etc."
        },
        cake:{
            img:"anniversary88.png",
            color1:"#8D6E63",
            color2:"#D7CCC8",
            offer:"Special Anniversary Offer",
            details:"Marriage issues / Family issues / Remedies / Vastu"
        }
    }
};

const theme = themes[type][cardType];

// LOAD CONTENT
document.getElementById("cardImage").src = theme.img;

document.documentElement.style.setProperty("--primary", theme.color1);
document.documentElement.style.setProperty("--secondary", theme.color2);
document.documentElement.style.setProperty("--offer-bg", theme.color2 + "22");

document.getElementById("headerText").innerHTML =
    (type==="birthday" ? "HAPPY BIRTHDAY<br><span>"+name+"</span>"
                       : "HAPPY ANNIVERSARY<br><span>"+name+"</span>");

document.getElementById("greetingText").innerHTML =
    (type==="birthday"
    ? "May the stars bring you immense joy and success on your special day."
    : "Wishing you endless happiness and continued success in your journey together.")
    + " Get cosmic guidance from Jyotish Devagya Amitsree.";

document.getElementById("offerHeader").textContent = theme.offer;
document.getElementById("offerDetails").textContent = theme.details;


// DOWNLOAD CARD
document.getElementById("downloadButton").onclick = () => {
    document.getElementById("downloadButton").style.display = "none";

    html2canvas(document.querySelector(".border-frame"), {
        scale: 2,
        useCORS: true
    }).then(canvas => {
        document.getElementById("downloadButton").style.display = "flex";

        let a = document.createElement("a");
        a.download = "DigdarshanAstro_"+name+"_Card.png";
        a.href = canvas.toDataURL();
        a.click();
    })
};
</script>

</body>
</html>
