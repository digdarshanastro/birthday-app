<!DOCTYPE html>
<html>
<head>
<title>Digdarshan Astro Wish Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="card-style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>
<body>

<div id="card">
    <div id="downloadButton"><i class="fa fa-download"></i></div>

    <div class="border-frame">
        <div class="card-inner">

            <div class="top-section">
                <img id="cardImage" src="">
            </div>

            <h2 id="headerText" class="header-text"></h2>

            <p class="greeting" id="greetingText"></p>

            <div class="offer-box">
                <strong id="offerHeader"></strong>
                <div class="offer-details" id="offerDetails"></div>
            </div>

            <div class="footer">
                With Best Wishes from <br>
                <span class="brand">Digdarshan Astro</span><br>
                47F Raja Rammohan Roy Road, Kolkata-8.<br>
                Jyotish Devagya Amitsree
                <span id="callNumber" class="call-number">Call : 8697190840 / 9830637766</span>
            </div>

        </div>
    </div>
</div>

<script>
// URL READ
const url = new URLSearchParams(window.location.search);
const type = url.get("type") || "birthday";
const style = url.get("cardType") || "floral";
let name = url.get("name") ? decodeURIComponent(url.get("name")) : "Dear Client";

// 2-COLOR THEMES BASED ON YOUR IMAGES
const themes = {
    birthday: {
        floral: {
            img: "birthday66.png",
            primary: "#7B1FA2",
            secondary: "#E91E63",
            offer_bg: "#FDE6EF",
            discount: "Get a Special Discount on Your Birthday",
            details: "Chart Reading / Gemstones / Rudraksha / Hoom / Hawan etc."
        },
        simple: {
            img: "birthday77.png",
            primary: "#8E44AD",
            secondary: "#D35400",
            offer_bg: "#FFE7D9",
            discount: "Get a Special Discount on Your Birthday",
            details: "Chart Reading / Gemstones / Rudraksha / Hoom / Hawan etc."
        }
    },

    anniversary: {
        cake: {
            img: "anniversary88.png",
            primary: "#6D4C41",
            secondary: "#D7A279",
            offer_bg: "#F7EDE5",
            discount: "Get a Special Discount on Your Anniversary",
            details: "Marriage Consultation / Family Problem Solutions / Vastu Tips etc."
        },
        heart: {
            img: "anniversary99.png",
            primary: "#C00000",
            secondary: "#FF5C8D",
            offer_bg: "#FFE6EB",
            discount: "Get a Special Discount on Your Anniversary",
            details: "Marriage Consultation / Family Problem Solutions / Vastu Tips etc."
        }
    }
};

const theme = themes[type][style];

// Apply Theme Colors
document.body.style.setProperty("--primary", theme.primary);
document.body.style.setProperty("--secondary", theme.secondary);
document.body.style.setProperty("--offer-bg", theme.offer_bg);

// Set Image
document.getElementById("cardImage").src = theme.img;

// Header Text
document.getElementById("headerText").innerHTML =
    (type === "birthday" ? "HAPPY BIRTHDAY" : "HAPPY ANNIVERSARY") +
    `<span>${name}!</span>`;

// Greeting Text
document.getElementById("greetingText").innerHTML =
(type === "birthday")
? "May the stars bring you immense joy and success on your special day. Start your new personal year with cosmic guidance from Jyotish Devagya Amitsree."
: "Wishing you endless happiness and continued success in your journey together. Get cosmic blessings from Jyotish Devagya Amitsree on this special day.";

// Offer Details
document.getElementById("offerHeader").innerHTML = theme.discount;
document.getElementById("offerDetails").innerHTML = theme.details;

/* DOWNLOAD PNG FIXED WITHOUT SHADE */
document.getElementById("downloadButton").onclick = function () {

    document.getElementById("downloadButton").style.display = "none";

    html2canvas(document.getElementById("card"), {
        scale: 2,
        backgroundColor: "#FFFFFF",
        useCORS: true
    }).then(canvas => {

        document.getElementById("downloadButton").style.display = "flex";

        let link = document.createElement("a");
        link.download = `DigdarshanAstro_${name.replace(/\s+/g, "_")}.png`;
        link.href = canvas.toDataURL();
        link.click();
    });
};
</script>

</body>
</html>
