<!DOCTYPE html>
<html lang="en">
<head>

<title>Digdarshan Astro – Wish Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ALWAYS LOAD CARD CSS FIRST (so nothing overrides it) -->
<link rel="stylesheet" href="card-style.css?v=500">

<!-- Premium Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- HD Export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>

<body>

<div id="card">

    <!-- Download Button -->
    <div id="downloadButton" title="Save Card">
        <i class="fas fa-download"></i>
    </div>

    <!-- Outer Luxury Frame -->
    <div id="coloredFrame" class="colored-frame">

        <div class="card-content">

            <!-- Image Section -->
            <div class="top-section">
                <img id="cardImage" src="" alt="Greeting Image">
            </div>

            <!-- Text + Footer -->
            <div class="bottom-section">

                <div>
                    <h2 id="headerText" class="header-text"></h2>

                    <p id="mainMessage" class="main-message">
                        <span id="greetingText"></span>
                    </p>

                    <!-- Premium Offer Highlight Box -->
                    <div id="offerHighlight" class="offer-highlight">
                        <span id="offerHeader"></span>
                        <span id="offerDetails" class="offer-services"></span>
                    </div>
                </div>

                <!-- (Hidden) WhatsApp Button -->
                <a id="whatsappButton" href="#" target="_blank"></a>

                <!-- Footer -->
                <div class="footer-section">
                    With Best Wishes from
                    <strong class="company-name">Digdarshan Astro</strong>
                    <span class="address-text">47F Raja Rammohan Roy Road, Kolkata-8.</span>
                    Jyotish Devagya Amitsree
                    <span class="call-number" id="callNumber">Call : 8697190840 / 9830637766</span>
                </div>

            </div>

        </div>

    </div>

</div>

<script>
/* url params */
const url = new URLSearchParams(window.location.search);
const type = url.get("type") || "birthday";
const cardType = url.get("cardType") || (type === "birthday" ? "floral" : "heart");
let name = decodeURIComponent(url.get("name") || "Dear Client");

/* DOM refs */
const coloredFrameElement = document.getElementById("coloredFrame");
const cardImage = document.getElementById("cardImage");
const headerTxtElement = document.getElementById("headerText");
const greetingTxtElement = document.getElementById("greetingText");
const offerHighlightElement = document.getElementById("offerHighlight");
const offerHeaderElement = document.getElementById("offerHeader");
const offerDetailsElement = document.getElementById("offerDetails");
const callNumberElement = document.getElementById("callNumber");
const downloadButton = document.getElementById("downloadButton");

/* THEMES */
const themes = {
    birthday: {
        floral: {
            img: "birthday66.png",
            discount: "Get a Special Discount on Your Birthday",
            details: "Chart Reading / Gemstones / Rudraksha / Hoom / Hawan etc.",
            borderColor: "#C62828",
            highlightBg: "#FFEBEE"
        },
        simple: {
            img: "birthday77.png",
            discount: "Get a Special Discount on Your Birthday",
            details: "Chart Reading / Gemstones / Rudraksha / Hoom / Hawan etc.",
            borderColor: "#7B1FA2",
            highlightBg: "#F3E5F5"
        }
    },
    anniversary: {
        cake: {
            img: "anniversary88.png",
            discount: "Get a Special Discount on Your Anniversary",
            details: "Marriage Consultation / Family Problem Solutions / Vastu Tips etc.",
            borderColor: "#6D4C41",
            highlightBg: "#FBE9E7"
        },
        heart: {
            img: "anniversary99.png",
            discount: "Get a Special Discount on Your Anniversary",
            details: "Marriage Consultation / Family Problem Solutions / Vastu Tips etc.",
            borderColor: "#9E0000",
            highlightBg: "#FFDEDE"
        }
    }
};

/* APPLY THEME */
let headerText = "";
let mainGreeting = "";
let currentTheme = null;

if (type === "birthday") {
    currentTheme = themes.birthday[cardType];
    headerText = `HAPPY BIRTHDAY <span>${name}!</span>`;
    mainGreeting =
        "May the stars bring you immense joy and success on your special day. Start your new personal year with cosmic guidance from Jyotish Devagya Amitsree.";
} else if (type === "anniversary") {
    currentTheme = themes.anniversary[cardType];
    headerText = `HAPPY ANNIVERSARY <span>${name}!</span>`;
    mainGreeting =
        "Wishing you endless happiness and continued success in your journey together. Get cosmic blessings from Jyotish Devagya Amitsree on this special day.";
}

/* Set content */
cardImage.src = currentTheme.img;
headerTxtElement.innerHTML = headerText;
greetingTxtElement.innerHTML = mainGreeting;

offerHeaderElement.innerHTML = `<strong>${currentTheme.discount}</strong>`;
offerDetailsElement.textContent = currentTheme.details;

/* Theme colors */
coloredFrameElement.style.setProperty("--theme-border", currentTheme.borderColor);
callNumberElement.style.color = currentTheme.borderColor;
offerHighlightElement.style.borderColor = currentTheme.borderColor;
offerHighlightElement.style.backgroundColor = currentTheme.highlightBg;

/* DOWNLOAD PNG */
downloadButton.onclick = () => {
    downloadButton.style.display = "none";

    html2canvas(document.getElementById("card"), {
        scale: 2,
        useCORS: true,
        backgroundColor: null
    }).then(canvas => {
        downloadButton.style.display = "flex";
        const link = document.createElement("a");
        link.download = `DigdarshanAstro_${name.replace(/\s/g, "_")}_Card.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
    });
};
</script>

</body>
</html>
