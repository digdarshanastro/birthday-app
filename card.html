<!DOCTYPE html>
<html>
<head>
<title>Wish Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="card-style.css"> 
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>

<div id="card">

  <div id="downloadButton" title="Save Card as Image">
    <i class="fas fa-download"></i>
  </div>

  <div id="coloredFrame" class="colored-frame">
      <div class="card-content">

          <div class="top-section">
              <img id="cardImage" src="" alt="Greeting Image">
          </div>

          <div class="bottom-section">

              <h2 id="headerText" class="header-text"></h2>

              <p class="main-message"><span id="greetingText"></span></p>

              <div id="offerHighlight" class="offer-highlight">
                <strong id="offerHeader"></strong>
                <span id="offerDetails" class="offer-services"></span>
              </div>

              <div class="footer-section">
                <span class="footer-line">With Best Wishes from</span>
                <strong class="company-name">Digdarshan Astro</strong>
                <span class="footer-line">47F Raja Rammohan Roy Road, Kolkata-8.</span>
                <span class="footer-line">Jyotish Devagya Amitsree</span>
                <span class="call-number" id="callNumber">Call : 8697190840 / 9830637766</span>
              </div>

          </div>
      </div>
  </div>
</div>


<script>
const url = new URLSearchParams(window.location.search);
const type = url.get("type") || "birthday";
const cardType = url.get("cardType") || "floral";
let name = url.get("name") ? decodeURIComponent(url.get("name")) : "Dear Client";

const themes = {
    birthday: {
        floral: {
            img: "birthday66.png",
            primary: "#7B1FA2",
            secondary: "#D81B60",
            highlight: "#FCE4EC",
            discount: "Get a Special Discount on Your Birthday",
            details: "Chart Reading / Career Consultation / Gemstones / Rudraksha / Hoom / Hawan etc."
        },
        simple: {
            img: "birthday77.png",
            primary: "#8E44AD",
            secondary: "#D35400",
            highlight: "#FDEDEC",
            discount: "Get a Special Discount on Your Birthday",
            details: "Chart Reading / Career Consultation / Gemstones / Rudraksha / Hoom / Hawan etc."
        }
    },

    anniversary: {
        cake: {
            img: "anniversary88.png",
            primary: "#6D4C41",
            secondary: "#A1887F",
            highlight: "#F6ECE7",
            discount: "Get a Special Discount on Your Anniversary",
            details: "Marriage Consultation / Family Problem Solutions / Vastu Tips etc."
        },
        heart: {
            img: "anniversary99.png",
            primary: "#C00000",
            secondary: "#FF4081",
            highlight: "#FFE6EA",
            discount: "Get a Special Discount on Your Anniversary",
            details: "Marriage Consultation / Family Problem Solutions / Vastu Tips etc."
        }
    }
};

let theme = themes[type][cardType];

// Apply image & text
document.getElementById("cardImage").src = theme.img;
document.getElementById("headerText").innerHTML =
    (type === "birthday" ? "HAPPY BIRTHDAY" : "HAPPY ANNIVERSARY") +
    ` <span>${name}!</span>`;
document.getElementById("greetingText").innerHTML =
    (type === "birthday")
    ? "May the stars bring you immense joy and success on your special day. Start your new personal year with cosmic guidance from Jyotish Devagya Amitsree."
    : "Wishing you endless happiness and continued success in your journey together. Get cosmic blessings from Jyotish Devagya Amitsree on this special day.";

document.getElementById("offerHeader").innerHTML = theme.discount;
document.getElementById("offerDetails").innerHTML = theme.details;

// Apply colors
document.body.style.setProperty("--theme-primary", theme.primary);
document.body.style.setProperty("--theme-secondary", theme.secondary);
document.body.style.setProperty("--theme-highlight", theme.highlight);

// Download Fix
document.getElementById("downloadButton").onclick = function () {

    document.getElementById("downloadButton").style.display = "none";

    html2canvas(document.getElementById("card"), {
        scale: 2,
        backgroundColor: "#ffffff",
        useCORS: true
    }).then(canvas => {

        document.getElementById("downloadButton").style.display = "flex";

        const link = document.createElement("a");
        link.download = `DigdarshanAstro_${name.replace(/\s+/g,"_")}.png`;
        link.href = canvas.toDataURL();
        link.click();
    });
};
</script>

</body>
</html>
