<!DOCTYPE html>
<html>
<head>
<title>Wish Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style (3).css"> 
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script> 
</head>
<body class="card-page"> 

<div id="card">
  <div class="card-border"> 
      <div class="colored-frame"> 
          <div class="card-top-section" id="cardImageSection" onclick="downloadCard()">
              <img id="cardImage" src="" alt="card image">
              <div id="downloadIcon">
                  <img src="download_icon.png" alt="Download PNG Icon">
              </div>
          </div>
          
          <div class="card-content-section">
              <div class="right-section">
                  <div class="header-text" id="headerTxt"></div>
                  <div class="main-message" id="msgTxt"></div>
              </div>
              <div class="footer-signature" id="footerTxt">
                With Best Wishes from
                <strong class="company-name">Digdarshan Astro</strong>
                <span class="address-text">47F Raja Rammohan Roy Road, Kolkata-8.</span>
                Jyotish Devagya Amitsree
                <span class="call-number" id="callNumber">Call : 8697190840 / 9830637766</span>
              </div>
          </div>
      </div>
  </div>
</div>

<script>
const url = new URLSearchParams(window.location.search);
const type = url.get("type") || 'birthday'; // Default to birthday
const cardType = url.get("cardType") || (type === 'birthday' ? 'simple' : 'cake'); // Default to simple/cake
let name = url.get("name");
let age = url.get("age");
let annivAge = url.get("annivAge"); // Check for annivAge if age is used for birthday

name = name ? decodeURIComponent(name) : "[Client's Name]";
age = age ? Number(age) : (annivAge ? Number(annivAge) : null); // Use annivAge if available

const coloredFrameElement = document.querySelector(".colored-frame"); 
const cardImage = document.getElementById("cardImage");
const headerTxtElement = document.getElementById("headerTxt");
const msgTxtElement = document.getElementById("msgTxt");
const callNumberElement = document.getElementById("callNumber");
const cardContainer = document.getElementById('card'); // Element to capture

let headerText = '';
let discountText = '';
let imageURL = '';
let frameColor = '';
let headerColor = '';
let callNumberColor = '';

// **THEME DEFINITIONS**
const themes = {
    birthday: {
        // birthday77.png (Simple/Candles) - Assuming 'simple' for old 'candle'
        simple: {
            img: 'birthday77.png',
            discount: "a special birthday discount on a birth chart reading & Gemstone!",
            borderColor: '#A0522D', 
            headerColor: '#B8860B', 
            callColor: '#B8860B'
        },
        // birthday66.jpg (Floral/Purple) - Assuming 'floral'
        floral: { 
            img: 'birthday66.jpg',
            discount: "a special birthday discount on a birth chart reading & Gemstone!",
            borderColor: '#53005A',
            headerColor: '#993399', 
            callColor: '#993399'
        }
    },
    anniversary: {
        // anniversary88.jpg (Cake)
        cake: {
            img: 'anniversary88.jpg',
            discount: "a special anniversary discount on a birth chart reading & Gemstone!",
            borderColor: '#8B0000',
            headerColor: '#DAA520',
            callColor: '#8B0000'
        },
        // anniversary99.jpg (Heart)
        heart: { 
            img: 'anniversary99.jpg',
            discount: "a special anniversary discount on a birth chart reading & Gemstone!",
            borderColor: '#CC0000',
            headerColor: '#B8860B',
            callColor: '#CC0000'
        }
    }
};

let currentTheme = null;

if (type === 'birthday') {
    currentTheme = themes.birthday[cardType] || themes.birthday.simple;
    headerText = `Happy ${age ? age + 'th ' : ''} Birthday, ${name}! 🎉`;
} else if (type === 'anniversary') {
    currentTheme = themes.anniversary[cardType] || themes.anniversary.cake;
    headerText = `Happy ${age ? age + 'th ' : ''} Anniversary, ${name}! 🥂`;
} else {
    // Fallback for unknown type
    headerText = `Hello, ${name}!`;
    discountText = "a special gift!";
    currentTheme = themes.birthday.simple; 
}

// Apply theme settings
if (currentTheme) {
    imageURL = currentTheme.img;
    discountText = currentTheme.discount;
    frameColor = currentTheme.borderColor;
    headerColor = currentTheme.headerColor;
    callNumberColor = currentTheme.callColor;

    coloredFrameElement.style.borderColor = frameColor;
    headerTxtElement.style.color = headerColor;
    callNumberElement.style.color = callNumberColor;
}


const mainMessage = `May the stars bring you immense joy and success this year. Start your new personal year with cosmic guidance from Jyotish Devagya Amitsree. Get ${discountText}`;

cardImage.src = imageURL;
headerTxtElement.innerHTML = headerText;
msgTxtElement.innerHTML = mainMessage;


// --- DOWNLOAD FUNCTION (NEW) ---
window.downloadCard = function() {
    // Elements to capture
    const downloadIcon = document.getElementById('downloadIcon');
    // Temporarily hide the download icon
    downloadIcon.style.opacity = '0';
    downloadIcon.style.pointerEvents = 'none';

    html2canvas(cardContainer, {
        allowTaint: true,
        useCORS: true,
        scale: 2, // Capture at a higher resolution
        backgroundColor: null 
    }).then(canvas => {
        // Create a link element to trigger the download
        const link = document.createElement('a');
        const fileName = `${type.toUpperCase()}_Card_${name.replace(/\s/g, '_')}_${cardType}.png`;
        link.download = fileName;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }).finally(() => {
        // Restore the download icon state after capture
        downloadIcon.style.opacity = '';
        downloadIcon.style.pointerEvents = '';
    });
};

// Expose function globally for admin.html to use (unchanged)
window.getWhatsAppMessage = function(cardLink) {
     const baseText = `*DIGDARSHAN ASTRO* wants to wish you a very happy ${type === 'birthday' ? 'Birthday' : 'Anniversary'}! \n\n*Special Offer just for you* - Get cosmic guidance from Jyotish Devagya Amitsree. \n\n_Visit our site for exciting offers_: https://digdarshanastro.mydurable.com/`;
     return `${baseText}\n\n${cardLink}`;
};

</script>
</body>
</html>
