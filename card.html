<!DOCTYPE html>
<html>
<head>
<title>Wish Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="card-style.css"> 
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<meta property="og:title" content="Special Wishes from Digdarshan Astro!" />
<meta property="og:description" content="Wishing you immense joy and success from Jyotish Devagya Amitsree. Get your offer now!" />
<meta property="og:url" content="https://your-app-domain.vercel.app/card.html" /> 
<meta property="og:type" content="website" />
</head>

<body> 

<div id="card">
  <div id="coloredFrame" class="colored-frame"> 
      <div class="card-content">
          <div class="top-section"> 
              <img id="cardImage" src="" alt="Greeting Image">
          </div>
          
          <div class="bottom-section">
              <div>
                  <h2 id="headerText" class="header-text"></h2>
                  
                  <p id="mainMessage" class="main-message">
                      <span id="greetingText"></span>
                  </p>
                  
                  <span id="offerHighlight" class="offer-highlight"></span>
              </div>
              
              <a id="whatsappButton" href="#" target="_blank">
                <i class="fab fa-whatsapp"></i> GET YOUR SPECIAL OFFER NOW!
              </a>

              <div class="footer-section">
                With Best Wishes from
                <strong class="company-name">Digdarshan Astro</strong>
                <span class="address-text">47F Raja Rammohan Roy Road, Kolkata-8.</span> 
                Jyotish Devagya Amitsree
                <span class="call-number" id="callNumber">Call : 8697190840 / 9830637766</span>
              </div>
          </div>
      </div>
  </div>
</div>

<script>
const url = new URLSearchParams(window.location.search);
const type = url.get("type") || 'birthday'; 
const cardType = url.get("cardType") || (type === 'birthday' ? 'elegant' : 'elegant');
let name = url.get("name");
let age = url.get("age");
let annivAge = url.get("annivAge"); 

name = name ? decodeURIComponent(name) : "Dear Client";
age = age ? Number(age) : (annivAge ? Number(annivAge) : null);

const coloredFrameElement = document.getElementById("coloredFrame"); 
const cardImage = document.getElementById("cardImage");
const headerTxtElement = document.getElementById("headerText");
const greetingTxtElement = document.getElementById("greetingText"); 
const offerHighlightElement = document.getElementById("offerHighlight"); 
const callNumberElement = document.getElementById("callNumber");
const whatsappButton = document.getElementById('whatsappButton');

let headerText = '';
let discountText = '';
let mainGreeting = '';

// **THEME DEFINITIONS based on uploaded images 1-4 & target styles 5-7**
const themes = {
    birthday: {
        // birthday77.png (Violet/Elegant - Target 6 style)
        elegant: {
            img: 'birthday77.png', 
            discount: "a *Special Discount* on Birth Chart Reading & Gemstones",
            borderColor: '#8A2BE2', // Blue Violet Border
            highlightBg: '#F3E5F5', // Light background for highlight box
        },
        // birthday66.jpg (Deep Red/Cake - Target 7 style)
        cake: {
            img: 'birthday66.jpg',
            discount: "a *Special Discount* on Birth Chart Reading & Gemstones",
            borderColor: '#B71C1C', // Deep Red/Maroon Border
            highlightBg: '#FFEBEE', // Light background for highlight box
        }
    },
    anniversary: {
        // anniversary88.jpg (Deep Blue/Corporate/Elegant)
        elegant: {
            img: 'anniversary88.jpg',
            discount: "a *Special Discount* on Family Problem Solutions Consultation",
            borderColor: '#0D47A1', // Deep Blue Border
            highlightBg: '#E3F2FD', // Light background for highlight box
        },
        // anniversary99.jpg (Brown/Sepia/Classic - Target 5 style)
        sepia: {
            img: 'anniversary99.jpg',
            discount: "a *Special Discount* on Family Problem Solutions Consultation",
            borderColor: '#5D4037', // Brown/Sepia Border
            highlightBg: '#FBE9E7', // Light background for highlight box
        }
    }
};

let currentTheme = null;

if (type === 'birthday') {
    currentTheme = themes.birthday[cardType] || themes.birthday.elegant;
    headerText = `HAPPY BIRTHDAY <span>${age ? age + 'th' : ''} ${name}!</span>`;
    mainGreeting = `May the stars bring you immense joy and success on your special day. Get cosmic guidance from Jyotish Devagya Amitsree for your new personal year.`;
} else if (type === 'anniversary') {
    currentTheme = themes.anniversary[cardType] || themes.anniversary.elegant;
    headerText = `HAPPY ANNIVERSARY <span>${age ? age + 'th' : ''} ${name}!</span>`;
    mainGreeting = `Wishing you endless happiness and continued success in your journey together. Get cosmic blessings from Jyotish Devagya Amitsree on this special day.`;
} else {
    headerText = `HELLO <span>${name}!</span>`;
    discountText = "*a special gift!*";
    currentTheme = themes.birthday.elegant; 
    mainGreeting = `Welcome to Digdarshan Astro!`;
}

// Apply theme settings
if (currentTheme) {
    const { img, discount, borderColor, highlightBg } = currentTheme;
    
    // Set text content
    cardImage.src = img;
    discountText = discount;
    headerTxtElement.innerHTML = headerText;
    greetingTxtElement.innerHTML = mainGreeting;
    // Offer text is now English
    offerHighlightElement.innerHTML = `Get from Jyotish Devagya Amitsree: ${discountText.replace(/\*/g, '<strong>')}`; 
    
    // Apply styling via JS
    coloredFrameElement.style.borderColor = borderColor;
    callNumberElement.style.color = borderColor;
    offerHighlightElement.style.borderColor = borderColor;
    offerHighlightElement.style.backgroundColor = highlightBg;
    
    // Set WhatsApp Share Link (Entirely English)
    const whatsappHeader = headerText.replace(/<span>.*?<\/span>/, ` ${name}!`).replace(/<.*?>/g, '').trim(); 
    
    const englishShareMessage = 
        `🎉 ${whatsappHeader} 🎉\n\n` + 
        `Dear Client, Jyotish Devagya Amitsree is giving you a special offer on your big day!\n` + 
        `✨ Get ${discountText.replace(/\*/g, '').trim()} by clicking the link below.\n\n` +
        `View your personalized card: ${window.location.href}`;
        
    whatsappButton.href = `https://wa.me/?text=${encodeURIComponent(englishShareMessage)}`;

} else {
    // Fallback if theme parameters are missing
    headerTxtElement.innerHTML = "ERROR <span>INVALID CARD TYPE</span>";
    greetingTxtElement.innerHTML = "Please check the URL parameters.";
}

</script>
</body>
</html>
