<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compact Landscape Card</title>
<link rel="stylesheet" href="card2-style.css">

<!-- Auto-theme based on image -->
<script>
const params = new URLSearchParams(window.location.search);
const type = params.get("type") || "birthday";
const cardType = params.get("cardType") || "floral";

let primary = "#8A1FA8";
let secondary = "#E84393";

if (type === "anniversary") {
    primary = "#B20000";
    secondary = "#FF6F6F";
}

document.documentElement.style.setProperty('--primary', primary);
document.documentElement.style.setProperty('--secondary', secondary);
</script>
</head>

<body>

<div id="card" class="land-card">

    <div class="left-img">
        <img id="cardImg" src="" alt="">
    </div>

    <div class="right-text">
        <h2 class="title" id="titleText"></h2>
        <h3 class="name" id="nameText"></h3>
        <p class="msg" id="msgText"></p>

        <div class="offer-box">
            <strong id="offerTitle"></strong>
            <p id="offerDesc"></p>
        </div>

        <div class="footer">
            <span>With Best Wishes from</span>
            <div class="brand">Digdarshan Astro</div>
            <div class="addr">47F Raja Rammohan Roy Road, Kolkata-8.</div>
            <div class="astro">Jyotish Devagya Amitsree</div>
            <div class="call">Call : 8697190840 / 9830637766</div>
        </div>
    </div>

</div>

<script>
const name = params.get("name") || "";
const typeText = type === "birthday" ? "HAPPY BIRTHDAY" : "HAPPY ANNIVERSARY";

document.getElementById("titleText").innerText = typeText;
document.getElementById("nameText").innerText = name;

document.getElementById("msgText").innerText =
 type === "birthday"
 ? "May the stars bring you immense joy and success on your special day. Get cosmic guidance from Jyotish Devagya Amitsree."
 : "Wishing you endless happiness and continued success in your journey together. Get cosmic blessings from Jyotish Devagya Amitsree.";

document.getElementById("offerTitle").innerText =
 type === "birthday"
 ? "Get a Special Discount on Your Birthday"
 : "Get a Special Discount on Your Anniversary";

document.getElementById("offerDesc").innerText =
 type === "birthday"
 ? "Chart Reading / Gemstones / Rudraksha / Hoom / Hawan etc."
 : "Marriage Consultation / Family Problem Solutions / Vastu Tips etc.";

// IMAGE loader
let imgFile = "birthday66.png";
if (type === "anniversary") imgFile = "anniversary99.png";
if (cardType === "cake") imgFile = "birthday77.png"; 
if (cardType === "heart") imgFile = "anniversary88.png";

document.getElementById("cardImg").src = imgFile;
</script>

</body>
</html>
