<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landscape Auto-Color Card</title>

<link rel="stylesheet" href="card-style.css">

<style>
/* Container */
.land-card {
    width: 100%;
    max-width: 900px;
    margin: auto;
    display: flex;
    background: #ffffff;
    border-radius: 18px;
    overflow: hidden;
    border: 6px solid var(--auto-border, #999);
}

/* LEFT IMAGE */
.left-img {
    width: 32%;
    background: #fafafa;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
}
.left-img img {
    width: 100%;
    height: auto;
    object-fit: contain;
    border-radius: 12px;
}

/* RIGHT SECTION */
.right-text {
    width: 68%;
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

/* Heading */
.title {
    font-size: 36px;
    font-family: "Playfair Display", serif;
    font-weight: 900;
    margin: 0;
    color: var(--auto-border);
}

/* Name beside heading */
.title span {
    font-size: 28px;
    font-weight: 700;
}

/* Message */
.msg {
    font-size: 16px;
    line-height: 1.52;
    margin: 18px 0;
    color: #444;
}

/* Offer box */
.offer-box {
    background: #fff8ff;
    padding: 18px 16px;
    border-radius: 12px;
    border: 2px solid var(--auto-border);
    margin: 14px 0;
}
.offer-box strong {
    font-size: 18px;
    color: var(--auto-border);
}

/* Footer */
.footer {
    margin-top: 20px;
    font-size: 14px;
    color: #333;
}
.footer .brand {
    font-family: "Playfair Display", serif;
    font-size: 20px;
    font-weight: 900;
    margin-top: 10px;
    color: var(--auto-border);
}
.footer .call {
    font-weight: 700;
    margin-top: 4px;
    color: var(--auto-border);
}

/* Responsive */
@media(max-width:650px){
    .land-card { flex-direction: column; }
    .left-img { width: 100%; }
    .right-text { width: 100%; padding: 22px; }
    .title { font-size: 30px; }
}
</style>

</head>
<body>

<div class="land-card" id="cardBox">

    <div class="left-img">
        <img id="cardImg" src="" alt="">
    </div>

    <div class="right-text">
        <div>
            <h1 class="title" id="titleText">
                Happy Birthday! <span id="nameText"></span>
            </h1>

            <p class="msg" id="msgText">
                Wishing you joy, success and cosmic blessings on your special day.
            </p>

            <div class="offer-box">
                <strong id="offerTitle">Special Discount on Your Birthday</strong>
                <p id="offerDesc">Chart Reading / Gemstones / Rudraksha / Hoom / Hawan etc.</p>
            </div>
        </div>

        <div class="footer">
            <span>With Best Wishes from</span>
            <div class="brand">Digdarshan Astro</div>
            <div>Jyotish Devagya Amitsree</div>
            <div class="call">Call : 8697190840 / 9830637766</div>
        </div>
    </div>

</div>

<script>
/* Read URL Params */
const p = new URLSearchParams(location.search);
const type = p.get("type") || "birthday";
const name = p.get("name") || "";
document.getElementById("nameText").textContent = name;

/* Image Select */
const img = document.getElementById("cardImg");
img.src = (type === "anniversary") ? "anniversary99.png" : "birthday66.png";

/* Auto border color detection */
img.onload = function () {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);

    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let r=0, g=0, b=0;

    for (let i=0; i < data.length; i+=4) {
        r += data[i];
        g += data[i+1];
        b += data[i+2];
    }

    const count = data.length/4;
    r = Math.round(r/count);
    g = Math.round(g/count);
    b = Math.round(b/count);

    const domColor = `rgb(${r},${g},${b})`;
    document.documentElement.style.setProperty("--auto-border", domColor);
};

/* Override text for Anniversary */
if (type === "anniversary") {
    document.getElementById("titleText").innerHTML =
        `Happy Anniversary! <span>${name}</span>`;
    document.getElementById("offerTitle").textContent =
        "Special Discount on Your Anniversary";
    document.getElementById("offerDesc").textContent =
        "Marriage Consultation / Family Solutions / Vastu Tips etc.";
}
</script>

</body>
</html>
