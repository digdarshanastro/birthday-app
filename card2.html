<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Landscape Card</title>

<style>
body{
    margin:0;
    padding:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f0ff;
    font-family:"Inter",sans-serif;
}

.card-wrap{
    width:600px;
    height:400px;
    background:#fff;
    display:flex;
    border:4px solid #5e1b8b;
    border-radius:18px;
    position:relative;
    overflow:hidden;
}

/* DOUBLE BORDER EFFECT */
.card-wrap:before, .card-wrap:after{
    content:"";
    position:absolute;
    border:3px solid #b77bff;
    border-radius:14px;
}
.card-wrap:before{
    inset:6px;
}
.card-wrap:after{
    inset:12px;
}

/* LEFT IMAGE */
.left-box{
    width:35%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
    background:#faf4ff;
    border-right:3px solid #e5ccff;
}
.left-box img{
    width:100%;
    height:auto;
    object-fit:contain;
}

/* RIGHT TEXT */
.right-box{
    width:65%;
    padding:16px 22px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    color:#333;
}

.title{
    font-size:26px;
    font-weight:900;
    color:#5e1b8b;
    margin-bottom:4px;
}

.name{
    font-size:20px;
    font-weight:800;
    color:#ff4f7c;
    margin-bottom:8px;
}

.msg{
    font-size:14px;
    line-height:1.5;
    margin-bottom:10px;
}

.offer{
    border:2px solid #5e1b8b;
    background:#fce8ff;
    padding:10px 12px;
    border-radius:12px;
    font-size:13px;
    text-align:left;
    margin-bottom:10px;
}
.offer strong{
    display:block;
    font-size:15px;
    color:#5e1b8b;
    margin-bottom:4px;
}

.footer{
    font-size:12px;
    margin-top:auto;
}
.brand{
    font-size:16px;
    font-weight:900;
    color:#5e1b8b;
}
.call{
    margin-top:4px;
    font-weight:900;
    color:#5e1b8b;
}
</style>
</head>

<body>

<div class="card-wrap">

    <!-- LEFT IMAGE -->
    <div class="left-box">
        <img id="cardImg" src="">
    </div>

    <!-- RIGHT CONTENT -->
    <div class="right-box">
        <div>
            <div class="title" id="titleText"></div>
            <div class="name" id="nameText"></div>
            <div class="msg" id="msgText"></div>

            <div class="offer">
                <strong id="offerTitle"></strong>
                <span id="offerDesc"></span>
            </div>
        </div>

        <div class="footer">
            With Best Wishes from<br>
            <span class="brand">Digdarshan Astro</span><br>
            47F Raja Rammohan Roy Road, Kolkata-8.<br>
            Jyotish Devagya Amitsree
            <div class="call">Call : 8697190840 / 9830637766</div>
        </div>
    </div>

</div>

<script>
// Collect params
const p = new URLSearchParams(window.location.search);
const type = p.get("type") || "birthday";
const name = p.get("name") || "";

// Dynamic Set
document.getElementById("nameText").innerText = name;

// Birthday
if(type === "birthday"){
    document.getElementById("titleText").innerText = "HAPPY BIRTHDAY";
    document.getElementById("msgText").innerText =
        "May the stars bring you immense joy and success on your special day. Get cosmic guidance from Jyotish Devagya Amitsree.";
    document.getElementById("offerTitle").innerText =
        "Get a Special Discount on Your Birthday";
    document.getElementById("offerDesc").innerText =
        "Chart Reading / Gemstones / Rudraksha / Hoom / Hawan etc.";
    document.getElementById("cardImg").src = "birthday66.png";
}

// Anniversary
else{
    document.getElementById("titleText").innerText = "HAPPY ANNIVERSARY";
    document.getElementById("msgText").innerText =
        "Wishing you endless happiness and continued success in your journey together. Get cosmic blessings.";
    document.getElementById("offerTitle").innerText =
        "Get a Special Discount on Your Anniversary";
    document.getElementById("offerDesc").innerText =
        "Marriage Consultation / Family Problem Solutions / Vastu Tips etc.";
    document.getElementById("cardImg").src = "anniversary99.png";
}
</script>

</body>
</html>
